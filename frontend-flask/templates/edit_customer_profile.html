<!DOCTYPE html>
<html lang="en">
 
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Customer Profile</title>
 
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
 
  <!-- CSS from static folder -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/intf_reg.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/animate.css') }}">
</head>
 
<body>
 
  <!-- Animated 3D Background Shapes -->
  <div class="bg-shape bg-shape1"></div>
  <div class="bg-shape bg-shape2"></div>
  <div class="bg-shape bg-shape3"></div>
  <div class="bg-cube"></div>
 
  <!-- Topbar -->
  <div class="topbar">
    <button class="back-btn" type="button" onclick="window.location.href='{{ url_for('customer_home') }}'">
      <i class="fa-solid fa-arrow-left"></i>
    </button>
    <span class="topbar-title">Edit Customer Profile</span>
  </div>
 
  <!-- Edit Profile Form -->
  <form class="form-container" method="POST" action="{{ url_for('edit_customer_profile') }}">
    <div class="form-title">Update Your Details</div>
 
    <!-- Fixed Fields (Read-only) -->
    <div style="background: #f5f5f5; padding: 15px; border-radius: 8px; margin-bottom: 15px; border-left: 4px solid #238915;">
      <p style="color: #666; font-size: 12px; margin-top: 0; margin-bottom: 8px;"><i class="fa-solid fa-lock"></i> These fields cannot be changed</p>
      
      <div class="input-row">
        <i class="fa-solid fa-user input-icon"></i>
        <input class="form-input" type="text" placeholder="First Name" value="{{ customer.first_name }}" readonly style="background: #e8e8e8; cursor: not-allowed;">
        <input class="form-input" type="text" placeholder="Last Name" value="{{ customer.last_name }}" readonly style="background: #e8e8e8; cursor: not-allowed;">
      </div>
 
      <div class="input-row">
        <i class="fa-solid fa-phone input-icon"></i>
        <input class="form-input" type="text" name="phone" placeholder="Phone No." value="{{ customer.phone }}" required>
        <input class="form-input" type="text" placeholder="Aadhar No." value="{{ customer.aadhar or '' }}" readonly style="background: #e8e8e8; cursor: not-allowed;">
      </div>
    </div>

    <!-- Editable Fields -->
    <div class="input-row">
      <i class="fa-solid fa-location-dot input-icon"></i>
      <select class="form-input" name="state" required><option value="{{ customer.state }}">{{ customer.state }}</option></select>
      <select class="form-input" name="city" required><option value="{{ customer.city }}">{{ customer.city }}</option></select>
    </div>
 
    <div class="input-row">
      <i class="fa-solid fa-map-marker-alt input-icon"></i>
      <input class="form-input" type="text" name="house_no" placeholder="House No." value="{{ customer.house_no or '' }}">
      <input class="form-input" type="text" name="pincode" placeholder="Pincode" value="{{ customer.pincode or '' }}">
    </div>

    <div class="input-row">
      <i class="fa-solid fa-map-pin input-icon"></i>
      <input class="form-input" type="text" name="locality" placeholder="* Locality" value="{{ customer.locality or '' }}" required>
      <input class="form-input" type="text" name="area" placeholder="* Area" value="{{ customer.area or '' }}" required>
    </div>

    <div class="input-row">
      <i class="fa-solid fa-key input-icon"></i>
      <input class="form-input" type="password" name="password" placeholder="New Password (leave blank to keep current)">
    </div>

    <div class="input-row">
      <i class="fa-solid fa-lock input-icon"></i>
      <input class="form-input" type="password" name="confirm_password" placeholder="Confirm New Password">
    </div>
 
    <button class="submit-btn" type="submit">UPDATE PROFILE</button>
  </form>
 
  <!-- JS for dynamic fields -->
  <script>
    // State and City data
    const stateCities = {

      "Bihar": ["Patna", "Gaya", "Bhagalpur", "Muzaffarpur", "Purnia", "Darbhanga", "Bihar Sharif", "Arrah", "Begusarai", "Katihar"],

      "Meghalaya": ["Shillong", "Tura", "Nongstoin", "Jowai", "Baghmara", "Williamnagar", "Nongpoh", "Cherrapunji", "Umroi", "Mairang"],
      "Mizoram": ["Aizawl", "Lunglei", "Saiha", "Champhai", "Lawngtlai", "Mamit", "Kolasib", "Serchhip", "Thenzawl", "Bilkhawthlir"],

      "Tripura": ["Agartala", "Dharmanagar", "Udaipur", "Ambassa", "Kailashahar", "Kumarghat", "Belonia", "Sabroom", "Teliamura", "Jirania"],

      "Uttarakhand": ["Dehradun", "Haridwar", "Rishikesh", "Nainital", "Almora", "Ranikhet", "Mussoorie", "Auli", "Pithoragarh", "Bageshwar"],
      "West Bengal": ["Kolkata", "Howrah", "Durgapur", "Asansol", "Siliguri", "Maheshtala", "Rajpur Sonarpur", "South Dum Dum", "Rajarhat Gopalpur", "Bhatpara"],
      "Delhi": ["New Delhi", "Delhi", "East Delhi", "North Delhi", "South Delhi", "West Delhi", "Central Delhi", "North-East Delhi", "North-West Delhi", "South-East Delhi"]
    };

    function isValidPhone(phone) {
      const phoneRegex = /^[6-9]\d{9}$/;
      return phoneRegex.test(phone);
    }

    document.addEventListener('DOMContentLoaded', function() {
      const stateSelect = document.querySelector('select[name="state"]');
      const citySelect = document.querySelector('select[name="city"]');
      
      // Populate state dropdown
      for (const state in stateCities) {
        if (!Array.from(stateSelect.options).some(option => option.value === state)) {
          const option = document.createElement('option');
          option.value = state;
          option.textContent = state;
          stateSelect.appendChild(option);
        }
      }
      
      // Populate city dropdown on page load
      const currentState = stateSelect.value;
      if (currentState && stateCities[currentState]) {
        stateCities[currentState].forEach(city => {
          if (!Array.from(citySelect.options).some(option => option.value === city)) {
            const option = document.createElement('option');
            option.value = city;
            option.textContent = city;
            citySelect.appendChild(option);
          }
        });
      }
      
      // Update city dropdown when state changes
      stateSelect.addEventListener('change', function() {
        const selectedState = this.value;
        citySelect.innerHTML = '<option value="">* Select City</option>';
        if (selectedState && stateCities[selectedState]) {
          stateCities[selectedState].forEach(city => {
            const option = document.createElement('option');
            option.value = city;
            option.textContent = city;
            citySelect.appendChild(option);
          });
        }
      });
    });

    // Form submission handler
    document.querySelector('.form-container').addEventListener('submit', function(event) {
      const password = document.querySelector('input[name="password"]').value.trim();
      const confirmPassword = document.querySelector('input[name="confirm_password"]').value.trim();

      // If password is being changed, validate it
      if (password || confirmPassword) {
        if (!password || !confirmPassword) {
          event.preventDefault();
          alert('❌ Please fill both password fields');
          return false;
        }

        if (password.length < 6) {
          event.preventDefault();
          alert('❌ Password must be at least 6 characters long');
          return false;
        }

        if (password !== confirmPassword) {
          event.preventDefault();
          alert('❌ Passwords do not match');
          return false;
        }
      }

      return true;
    });
  </script>
 
</body>
</html>
