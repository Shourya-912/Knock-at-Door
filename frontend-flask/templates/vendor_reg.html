<!DOCTYPE html>
<html lang="en">
 
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register as Vendor</title>
 
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
 
  <!-- CSS from static folder -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/intf_reg.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/animate.css') }}">
</head>
 
<body>
 
  <!-- Animated 3D Background Shapes -->
  <div class="bg-shape bg-shape1"></div>
  <div class="bg-shape bg-shape2"></div>
  <div class="bg-shape bg-shape3"></div>
  <div class="bg-cube"></div>
 
  <!-- Topbar -->
  <div class="topbar">
    <button class="back-btn" type="button" onclick="window.location.href='{{ url_for('register') }}'">
      <i class="fa-solid fa-arrow-left"></i>
    </button>
    <span class="topbar-title">Register as Vendor</span>
  </div>
 
  <!-- Registration Form -->
  <form class="form-container" method="POST" action="{{ url_for('vendor_reg') }}" enctype="multipart/form-data">
    <div class="form-title">Register yourself here</div>
 
    <div class="input-row">
      <i class="fa-solid fa-user input-icon"></i>
      <input class="form-input" type="text" name="first_name" placeholder="* First Name" required>
      <input class="form-input" type="text" name="last_name" placeholder="* Last Name" required>
    </div>
 
    <div class="input-row">
      <i class="fa-solid fa-phone input-icon"></i>
      <input class="form-input" type="text" name="phone" placeholder="* Phone No." required>
      <input class="form-input" type="text" name="aadhar" placeholder="* Aadhar No." required>
    </div>
 
    <!-- Vendor items (photo, price, name) -->
    <div class="input-row" id="item-fields">
      <i class="fa-solid fa-box input-icon"></i>
      <input class="form-input" type="text" name="item1_name" placeholder="* Item 1 Name" required>
      <input class="form-input" type="text" name="item1_price" placeholder="* Price (e.g., 100, 250/kg)" required>
    </div>
    <div class="input-row">
      <i class="fa-solid fa-image input-icon"></i>
      <input class="form-input form-file-input" type="file" name="item1_photo" accept="image/*" required>
    </div>
    <div class="input-row">
      <i class="fa-solid fa-box input-icon"></i>
      <input class="form-input" type="text" name="item2_name" placeholder="Item 2 Name">
      <input class="form-input" type="text" name="item2_price" placeholder="Price (e.g., 100, 250/kg)">
    </div>
    <div class="input-row">
      <i class="fa-solid fa-image input-icon"></i>
      <input class="form-input form-file-input" type="file" name="item2_photo" accept="image/*">
    </div>
    <div id="extra-item-fields"></div>
    <button type="button" class="add-item-btn" onclick="addItemField()">+ Add Item</button>
 
    <!-- Vendor localities -->
    <div class="input-row" id="locality-fields">
      <i class="fa-solid fa-map-marker-alt input-icon"></i>
      <input class="form-input" type="text" name="locality1" placeholder="* Locality/Society" required>
    </div>
    <button type="button" class="add-locality-btn" onclick="addLocalityField()">+ Add Locality</button>
 
    <div class="input-row">
      <i class="fa-solid fa-location-dot input-icon"></i>
      <input class="form-input" type="text" name="area" placeholder="* Area" required>
      <select class="form-input" name="state" required><option value="">* Select State</option></select>
    </div>
 
    <div class="input-row">
      <i class="fa-solid fa-city input-icon"></i>
      <select class="form-input" name="city" required><option value="">* Select City</option></select>
      <input class="form-input" type="text" name="pincode" placeholder="* Pincode" required>
    </div>
 
    <div class="input-row">
      <i class="fa-solid fa-key input-icon"></i>
      <input class="form-input" type="password" name="password" placeholder="* Password" required>
    </div>
 
    <div class="input-row">
      <i class="fa-solid fa-lock input-icon"></i>
      <input class="form-input" type="password" name="confirm_password" placeholder="* Confirm Password" required>
    </div>
 
    <button class="submit-btn" type="submit">SUBMIT</button>
  </form>
 
  <!-- JS for dynamic fields -->
  <script>
    let extraItemIndex = 0;
    function addItemField() {
      extraItemIndex++;
      const extraFields = document.getElementById("extra-item-fields");
      
      // Item name and price row
      const inputRow = document.createElement("div");
      inputRow.className = "input-row";
      inputRow.innerHTML = `
        <i class="fa-solid fa-box input-icon"></i>
        <input class="form-input" type="text" name="item_extra_name[]" placeholder="Extra Item Name">
        <input class="form-input" type="text" name="item_extra_price[]" placeholder="Price (e.g., 100, 250/kg)">
      `;
      extraFields.appendChild(inputRow);
      
      // File input row
      const fileRow = document.createElement("div");
      fileRow.className = "input-row";
      fileRow.innerHTML = `
        <i class="fa-solid fa-image input-icon"></i>
        <input class="form-input form-file-input" type="file" name="item_extra_photo[]" accept="image/*">
      `;
      extraFields.appendChild(fileRow);
    }
 
    function addLocalityField() {
      const localityFields = document.getElementById("locality-fields");
      const inputRow = document.createElement("div");
      inputRow.className = "input-row";
      inputRow.innerHTML = `
        <i class="fa-solid fa-map-marker-alt input-icon"></i>
        <input class="form-input" type="text" name="locality_extra[]" placeholder="Extra Locality/Society">
      `;
      localityFields.parentNode.insertBefore(inputRow, localityFields.nextSibling);
    }

    // Validation functions
    function isValidPhone(phone) {
      // Exactly 10 digits, starts with 6, 7, 8, or 9
      const phoneRegex = /^[6-9]\d{9}$/;
      return phoneRegex.test(phone);
    }

    function isValidAadhar(aadhar) {
      // Exactly 12 digits
      const aadharRegex = /^\d{12}$/;
      return aadharRegex.test(aadhar);
    }

    // Form submission handler
    document.querySelector('.form-container').addEventListener('submit', function(event) {
      const phone = document.querySelector('input[name="phone"]').value.trim();
      const aadhar = document.querySelector('input[name="aadhar"]').value.trim();

      // Validate phone number
      if (!phone) {
        event.preventDefault();
        alert('❌ Phone number is required');
        return false;
      }

      if (!isValidPhone(phone)) {
        event.preventDefault();
        alert('❌ Invalid Phone Number!\n\nPhone must be: Exactly 10 digits\n\nExample: 9876543210');
        return false;
      }

      // Validate aadhar
      if (!aadhar) {
        event.preventDefault();
        alert('❌ Aadhar number is required');
        return false;
      }

      if (!isValidAadhar(aadhar)) {
        event.preventDefault();
        alert('❌ Invalid Aadhar Number!\n\nAadhar must be: Exactly 12 digits\n• Only numbers\n\nExample: 123456789012');
        return false;
      }

      // If all validations pass, form will submit
      return true;
    });

    // State and City data
    const stateCities = {
      "Andhra Pradesh": ["Amaravati", "Visakhapatnam", "Vijayawada", "Nellore", "Kurnool", "Tirupati", "Anantapur", "Guntur", "Tenali", "Ongole"],
      "Arunachal Pradesh": ["Itanagar", "Naharlagun", "Pasighat", "Tezpur", "Changlang", "Tezu", "Roing", "Seppa", "Ziro", "Namsai"],
      "Assam": ["Guwahati", "Silchar", "Dibrugarh", "Nagaon", "Tinsukia", "Barpeta", "Karimganj", "Sonitpur", "Jorhat", "Golaghat"],
      "Bihar": ["Patna", "Gaya", "Bhagalpur", "Muzaffarpur", "Purnia", "Darbhanga", "Bihar Sharif", "Arrah", "Begusarai", "Katihar"],
      "Chhattisgarh": ["Raipur", "Bhilai", "Durg", "Rajnandgaon", "Bilaspur", "Korba", "Raigarh", "Dhamtari", "Mandir", "Jagdalpur"],
      "Goa": ["Panaji", "Vasco da Gama", "Margao", "Mapusa", "Pernem", "Bicholim", "Ponda", "Sattari", "Sanguem", "Quepem"],
      "Gujarat": ["Ahmedabad", "Surat", "Vadodara", "Rajkot", "Bhavnagar", "Jamnagar", "Junagadh", "Gandhinagar", "Anand", "Nadiad"],
      "Haryana": ["Faridabad", "Gurgaon", "Hisar", "Rohtak", "Panipat", "Ambala", "Yamunanagar", "Karnal", "Jind", "Sirsa"],
      "Himachal Pradesh": ["Shimla", "Solan", "Mandi", "Kangra", "Hamirpur", "Bilaspur", "Kinnaur", "Chamba", "Kullu", "Palampur"],
      "Jharkhand": ["Ranchi", "Dhanbad", "Giridih", "Bokaro", "Hazaribagh", "Dumka", "Deoghar", "Chaibasa", "Medininagar", "Simdega"],
      "Karnataka": ["Bangalore", "Mysore", "Hubli", "Mangalore", "Belgaum", "Gulbarga", "Davangere", "Bellary", "Bijapur", "Shimoga"],
      "Kerala": ["Thiruvananthapuram", "Kochi", "Kozhikode", "Thrissur", "Alappuzha", "Pathanamthitta", "Idukki", "Wayanad", "Kasaragod", "Ernakulam"],
      "Madhya Pradesh": ["Bhopal", "Indore", "Jabalpur", "Gwalior", "Ujjain", "Sagar", "Rewa", "Satna", "Ratlam", "Dewas"],
      "Maharashtra": ["Mumbai", "Pune", "Nagpur", "Thane", "Nashik", "Aurangabad", "Solapur", "Kolhapur", "Amravati", "Nanded"],
      "Manipur": ["Imphal", "Bishnupur", "Thoubal", "Ukhrul", "Senapati", "Churachandpur", "Tamenglong", "Kakching", "Jiribam", "Chandel"],
      "Meghalaya": ["Shillong", "Tura", "Nongstoin", "Jowai", "Baghmara", "Williamnagar", "Nongpoh", "Cherrapunji", "Umroi", "Mairang"],
      "Mizoram": ["Aizawl", "Lunglei", "Saiha", "Champhai", "Lawngtlai", "Mamit", "Kolasib", "Serchhip", "Thenzawl", "Bilkhawthlir"],

      "Punjab": ["Ludhiana", "Amritsar", "Jalandhar", "Patiala", "Bathinda", "Mohali", "Hoshiarpur", "Batala", "Pathankot", "Moga"],
      "Rajasthan": ["Jaipur", "Jodhpur", "Udaipur", "Kota", "Ajmer", "Bikaner", "Alwar", "Bharatpur", "Sikar", "Churu"],
      "Sikkim": ["Gangtok", "Namchi", "Singtam", "Gyalshing", "Mangan", "Pakyong", "Rangpo", "Soreng", "Ravangla", "Dentam"],
      "Tamil Nadu": ["Chennai", "Coimbatore", "Madurai", "Tiruchirappalli", "Salem", "Tirunelveli", "Tiruppur", "Vellore", "Erode", "Thoothukudi"],
      "Telangana": ["Hyderabad", "Warangal", "Nizamabad", "Karimnagar", "Ramagundam", "Khammam", "Mahbubnagar", "Medak", "Nalgonda", "Adilabad"],
      "Tripura": ["Agartala", "Dharmanagar", "Udaipur", "Ambassa", "Kailashahar", "Kumarghat", "Belonia", "Sabroom", "Teliamura", "Jirania"],
      "Uttar Pradesh": ["Lucknow", "Kanpur", "Ghaziabad", "Agra", "Meerut", "Varanasi", "Allahabad", "Moradabad", "Aligarh", "Saharanpur"],
      "Uttarakhand": ["Dehradun", "Haridwar", "Rishikesh", "Nainital", "Almora", "Ranikhet", "Mussoorie", "Auli", "Pithoragarh", "Bageshwar"],
      "West Bengal": ["Kolkata", "Howrah", "Durgapur", "Asansol", "Siliguri", "Maheshtala", "Rajpur Sonarpur", "South Dum Dum", "Rajarhat Gopalpur", "Bhatpara"],
      "Delhi": ["New Delhi", "Delhi", "East Delhi", "North Delhi", "South Delhi", "West Delhi", "Central Delhi", "North-East Delhi", "North-West Delhi", "South-East Delhi"]
    };

    document.addEventListener('DOMContentLoaded', function() {
      const stateSelect = document.querySelector('select[name="state"]');
      for (const state in stateCities) {
        const option = document.createElement('option');
        option.value = state;
        option.textContent = state;
        stateSelect.appendChild(option);
      }
      stateSelect.addEventListener('change', function() {
        const selectedState = this.value;
        const citySelect = document.querySelector('select[name="city"]');
        citySelect.innerHTML = '<option value="">* Select City</option>';
        if (selectedState && stateCities[selectedState]) {
          stateCities[selectedState].forEach(city => {
            const option = document.createElement('option');
            option.value = city;
            option.textContent = city;
            citySelect.appendChild(option);
          });
        }
      });
    });
  </script>
 
</body>
</html>
